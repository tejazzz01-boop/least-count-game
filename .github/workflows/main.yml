name: Build Least Count APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      accept-android-sdk-licenses: 'true'

  - name: Extract project ZIP
    run: |
      unzip -q LeastCountAndroid.zip -d extracted
      echo "ZIP extracted successfully"
      find extracted -name gradlew -type f

  - name: Locate Android project
    run: |
      GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: No gradlew found in ZIP"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLEW")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      chmod +x "$GRADLEW"

  - name: Build debug APK
    run: |
      cd "$PROJECT_DIR"
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LeastCount-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
          
